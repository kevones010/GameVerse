<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Categorias</title>
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <nav class="navbar">
          <a href="index.html" class="brand">
            <span class="brand-mark">G</span>
            <span>GameVerse</span>
          </a>
          <div class="nav-actions">
            <label class="search-box">
              <span>🔎</span>
              <input id="searchInput" type="text" placeholder="Buscar jogos" autocomplete="off" />
            </label>
            <a href="index.html" class="nav-btn">Home</a>
            <a href="categorias.html" class="nav-btn active">Categorias</a>
            <a href="favoritos.html" class="nav-btn">Favoritos</a>
          </div>
        </nav>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </header>

      <main class="home-page">
        <section class="section-block">
          <div class="section-heading">
            <div>
              <h2>Catálogo</h2>
              <p>Explore jogos por gênero, plataforma e estilo</p>
            </div>
          </div>
          <div class="filter-row" id="filters"></div>
          <label class="catalog-order">Ordenar por
            <select id="ordering">
              <option value="relevance">Relevância</option>
              <option value="-added">Popularidade</option>
              <option value="-rating">Mais bem avaliados</option>
              <option value="-released">Mais recentes</option>
              <option value="name">Nome</option>
            </select>
          </label>
          <div class="catalog-grid" id="catalogResults"></div>
          <div class="pagination" id="pagination"></div>
        </section>
      </main>
    </div>

    <script type="module" src="js/categorias.js"></script>
  </body>
</html>
