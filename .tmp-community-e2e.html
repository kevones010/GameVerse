<!doctype html>
<html lang="pt-BR">
  <body>
    <header id="header"></header>
    <iframe id="communityFrame" src="comunidade.html" title="Comunidade em teste" style="width:1280px;height:900px;border:0"></iframe>
    <output id="testResult"></output>
    <script type="module">
      const wait = (milliseconds = 30) => new Promise((resolve) => setTimeout(resolve, milliseconds));
      const waitFor = async (predicate, timeout = 7000) => {
        const startedAt = Date.now();
        while (Date.now() - startedAt < timeout) {
          if (predicate()) return true;
          await wait();
        }
        return false;
      };

      const frame = document.getElementById("communityFrame");
      const waitForLoad = () => new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
      await waitForLoad();
      await waitFor(() => frame.contentDocument.querySelectorAll(".post-card").length === 6);

      let doc = frame.contentDocument;
      const initialPostCount = doc.querySelectorAll(".post-card").length;
      const storageKey = "gameverse-community:v1";
      const initialState = JSON.parse(localStorage.getItem(storageKey));
      const storageStructure = initialState?.schemaVersion === 1
        && initialState.users.length === 6
        && initialState.posts.length === 15
        && ["comments", "likes", "savedPosts", "follows", "reports"].every((key) => Array.isArray(initialState[key]));

      const filterResults = {};
      const expectedCounts = { guide: 4, art: 2, screenshot: 3, discussion: 3, question: 3 };
      for (const [type, expected] of Object.entries(expectedCounts)) {
        doc.querySelector(`[data-value="${type}"]`).click();
        await waitFor(() => !doc.getElementById("communityFeed").classList.contains("is-updating"));
        filterResults[type] = doc.querySelectorAll(`.post-card--${type}`).length === expected
          && doc.querySelectorAll(".post-card").length === expected;
      }

      doc.querySelector('[data-value="all"]').click();
      await waitFor(() => doc.querySelectorAll(".post-card").length === 6);
      doc.querySelector('[data-value="recent"]').click();
      await waitFor(() => !doc.getElementById("communityFeed").classList.contains("is-updating"));
      const recentFirst = doc.querySelector(".post-card")?.dataset.postId;
      doc.querySelector('[data-value="trending"]').click();
      await waitFor(() => !doc.getElementById("communityFeed").classList.contains("is-updating"));
      const trendingFirst = doc.querySelector(".post-card")?.dataset.postId;
      doc.querySelector('[data-value="for-you"]').click();
      await waitFor(() => !doc.getElementById("communityFeed").classList.contains("is-updating"));
      const tabsWork = recentFirst && trendingFirst && recentFirst !== trendingFirst
        && doc.querySelector('[data-value="for-you"]').getAttribute("aria-pressed") === "true";

      const spoilerCard = doc.querySelector(".spoiler-box")?.closest(".post-card");
      const spoilerTitleWasProtected = Boolean(spoilerCard) && !spoilerCard.querySelector(".post-title");
      spoilerCard?.querySelector(".spoiler-reveal")?.click();
      const spoilerWasRevealed = Boolean(spoilerCard?.querySelector(".post-title"));

      const loadButton = doc.getElementById("loadMorePosts");
      loadButton.click();
      await waitFor(() => doc.querySelectorAll(".post-card").length === 12);
      const firstPageExpanded = doc.querySelectorAll(".post-card").length === 12;
      loadButton.click();
      await waitFor(() => doc.querySelectorAll(".post-card").length === 15);
      const paginationWorks = firstPageExpanded
        && doc.querySelectorAll(".post-card").length === 15
        && loadButton.hidden;

      const allCountersDisabled = [...doc.querySelectorAll(".post-stat")].every((button) => button.disabled);
      const sidebarDerived = doc.querySelectorAll("#popularGames li").length > 0
        && doc.querySelectorAll("#popularGuides li").length > 0
        && doc.querySelectorAll("#popularTags li").length > 0;

      initialState.auditMarker = "preserved-on-refresh";
      initialState.posts[0].content = '<img src=x onerror="parent.__communityXss=true">';
      localStorage.setItem(storageKey, JSON.stringify(initialState));
      frame.src = "comunidade.html?refresh-test=1";
      await waitForLoad();
      await waitFor(() => frame.contentDocument.querySelectorAll(".post-card").length === 6);
      doc = frame.contentDocument;
      const persistedState = JSON.parse(localStorage.getItem(storageKey));
      const persistenceWorks = persistedState.auditMarker === "preserved-on-refresh" && persistedState.posts.length === 15;
      const xssWasEscaped = !window.__communityXss
        && !doc.querySelector('.post-content img')
        && [...doc.querySelectorAll(".post-content")].some((element) => element.textContent.includes("<img src=x"));

      const stateWithoutArt = JSON.parse(JSON.stringify(initialState));
      stateWithoutArt.posts = stateWithoutArt.posts.filter((post) => post.type !== "art");
      localStorage.setItem(storageKey, JSON.stringify(stateWithoutArt));
      frame.src = "comunidade.html?empty-test=1";
      await waitForLoad();
      await waitFor(() => frame.contentDocument.querySelectorAll(".post-card").length === 6);
      doc = frame.contentDocument;
      doc.querySelector('[data-value="art"]').click();
      await waitFor(() => Boolean(doc.querySelector(".community-state")));
      const emptyStateWorks = doc.querySelector(".community-state")?.textContent.includes("Nenhuma publicação encontrada")
        && [...doc.querySelectorAll(".community-state button")].some((button) => button.textContent === "Ver todas");

      const sourcePages = await Promise.all(["index.html", "categorias.html", "favoritos.html"].map(async (url) => {
        const html = await fetch(url).then((response) => response.text());
        return new DOMParser().parseFromString(html, "text/html").querySelector('a[href="comunidade.html"]') !== null;
      }));

      const { renderHeader } = await import("./js/ui.js");
      renderHeader({ name: "Jogo de teste" });
      const dynamicHeaderHasCommunity = document.querySelector('#header a[href="comunidade.html"]') !== null;
      const communityHasHome = doc.querySelector('a[href="index.html"]') !== null;
      const controlsAreAccessible = [...doc.querySelectorAll("#feedTabs button, #postFilters button")]
        .every((button) => button.type === "button" && button.hasAttribute("aria-pressed"));

      const communityLink = doc.querySelector('a[href="index.html"]');
      communityLink.click();
      await wait(50);
      const veeTransitionWorks = Boolean(doc.querySelector(".gv-transition.is-active"));

      document.getElementById("testResult").textContent = JSON.stringify({
        initialPostCount,
        storageStructure,
        filterResults,
        tabsWork,
        spoilerTitleWasProtected,
        spoilerWasRevealed,
        paginationWorks,
        allCountersDisabled,
        sidebarDerived,
        persistenceWorks,
        xssWasEscaped,
        emptyStateWorks,
        staticHeadersHaveCommunity: sourcePages.every(Boolean),
        dynamicHeaderHasCommunity,
        communityHasHome,
        controlsAreAccessible,
        veeTransitionWorks
      });
    </script>
  </body>
</html>
