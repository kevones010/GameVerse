<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Detalhes do jogo</title>
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar" id="header"></header>

      <main class="game-page">
        <section class="hero-section" id="hero"></section>

        <div class="content-grid">
          <div class="main-column">
            <section class="section-card" id="synopsis"></section>
            <section class="section-card" id="trailer"></section>
            <section class="section-card" id="screenshots"></section>
            <section class="section-card" id="analysis"></section>
            <section class="section-card" id="similar"></section>
          </div>

          <aside class="side-column">
            <section class="section-card" id="info"></section>
            <section class="section-card" id="prices"></section>
            <section class="section-card" id="rating"></section>
          </aside>
        </div>
      </main>

      <footer class="site-footer" id="footer"></footer>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
