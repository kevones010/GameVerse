<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVerse | Minha coleção</title>
    <link rel="icon" href="assets/brand/vee-favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/header-search.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
    <script src="js/a11y-boot.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <nav class="navbar">
          <a href="index.html" class="brand">
            <span class="brand-mark"><img src="assets/brand/vee-logo-head.png" alt="Vee, mascote do GameVerse" /></span>
            <span>GameVerse</span>
          </a>
          <div class="nav-actions">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="categorias.html" class="nav-btn">Categorias</a>
            <a href="comunidade.html" class="nav-btn">Comunidade</a>
            <a href="favoritos.html" class="nav-btn active">Coleção</a>
          </div>
        </nav>
      </header>
      <main class="home-page">
        <section class="section-block collection-section" aria-labelledby="collectionTitle">
          <div class="section-heading">
            <div>
              <h1 id="collectionTitle">Minha coleção</h1>
              <p>Seus favoritos e o que você quer jogar, está jogando, zerou ou abandonou. Fica salvo neste navegador.</p>
            </div>
            <span class="chip" id="favoritesCount" aria-label="Total de jogos na coleção">0</span>
          </div>
          <div class="stat-grid" id="collectionStats"></div>
          <div class="filter-row collection-tabs" id="collectionTabs" role="group" aria-label="Filtrar coleção"></div>
          <p class="empty-state" id="collectionNotice" role="status"></p>
          <div class="catalog-grid" id="favoritesList"></div>
        </section>
      </main>
    </div>
    <script type="module" src="js/favoritos.js"></script>
    <script type="module" src="js/motion.js"></script>
    <script type="module" src="js/headerSearch.js"></script>
    <script type="module" src="js/accountMenu.js"></script>
    <script type="module" src="js/accessibility.js"></script>
  </body>
</html>
